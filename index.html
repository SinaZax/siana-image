<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171411">
    <meta name="description" content="منوی دیجیتال کافه Siana">
    <title>SIANA | منوی کافه\</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header id="hero">
    <div class="hero-content">

        <img id="cafeLogo" src="images/logo.jpg" alt="Siana Cafe Logo">

        <h1 id="cafeName">SIANA</h1>

        <p id="cafeSubtitle">A Taste of Coffee</p>

        <p id="cafeDescription">
            تجربه‌ای متفاوت از طعم قهوه و لحظه‌های خوشمزه
        </p>

    </div>
</header>

<main>

    <section class="menu-section">

        <div class="menu-heading">
            <div>
                <span class="section-label">SIANA MENU</span>
                <h2>منوی کافه</h2>
            </div>
        </div>

        <div id="categories"></div>

        <div id="products"></div>

        <div id="emptyState">
            محصولی در این دسته‌بندی وجود ندارد.
        </div>

    </section>

</main>

<footer>

    <h3 id="footerCafeName">SIANA</h3>

    <div class="cafe-details">

        <div class="footer-item">
            <span class="footer-icon">◷</span>
            <span>ساعت کاری: ۹ صبح تا ۱۲ شب</span>
        </div>

        <a
            class="footer-item map-link"
            href="https://neshan.org/maps/places/Sbvh8KeFYyqK#c35.696-52.028-16z-0p"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="footer-icon">⌖</span>
            <span>مشاهده مسیر کافه</span>
        </a>

    </div>

    <div class="footer-bottom">
        <p>تمامی حقوق برای کافه SIANA محفوظ است.</p>
    </div>

</footer>

<script src="js/app.js"></script>
</body> \</html>
